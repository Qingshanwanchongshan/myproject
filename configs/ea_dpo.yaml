# =============================================================================
# EA-DPO 第一轮：用全量数据的 50% 看趋势（单卡 4090/24G 或更大卡，bf16）
# -----------------------------------------------------------------------------
# 数据   : data/uf-subset —— 由 `python scripts/prepare_data.py` 生成
#          train 30500 对（全量 61135 的 50%）/ test 512 对（固定评测集）
# 步数   : max_steps: -1 + num_train_epochs: 1 → 自动 = 30500/8 ≈ 3813 步
#          改数据量只改 prepare_data.py 的 --train-size，这里不用动
# 对照组 : configs/dpo_baseline.yaml —— 除 ea_* 外逐字段相同
# 全量轮 : configs/ea_dpo_full.yaml
# 冒烟   : 不改本文件，命令行覆盖
#          --max_steps 10 --eval_strategy no --save_strategy no --output_dir outputs/smoke-ea
# 续跑   : --resume_from_checkpoint auto
# 想临时缩短：bash scripts/run_first_round.sh ea  前面加 STEPS=1500
# =============================================================================
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
dataset_name: data/uf-subset
attn_implementation: sdpa
dtype: bfloat16
bf16: true

# ---- LoRA：all-linear + r16/alpha32，让两种方法都有足够容量把差异表现出来 ----
use_peft: true
lora_r: 16
lora_alpha: 32
lora_target_modules: all-linear

# ---- 优化：有效 batch 8 对（1 × 8），线性衰减 + 3% warmup ----
# lr=1.0e-5：all-linear LoRA 的常用量级（原 5.0e-6 偏保守）。
# 想验证结论不是学习率造出来的：LR=5.0e-6 TAG=lr5e-6 bash scripts/run_first_round.sh
learning_rate: 1.0e-5
beta: 0.1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_steps: 100
max_length: 1024
max_steps: -1
num_train_epochs: 1

# ---- 日志 / 评测 / 存档（3813 步 → 8 个评测点，每次约 3-4 分钟）----
logging_steps: 5
eval_strategy: steps
eval_steps: 500
per_device_eval_batch_size: 2
save_strategy: steps
save_steps: 500
save_total_limit: 3
report_to: tensorboard

# ---- 显存与数据处理 ----
# 梯度检查点必须关：EA 的观察器只在 forward 期间临时替换 attn 实现，
# checkpoint 反向重算时会用回原始 sdpa 路径，两者不一致直接抛 CheckpointError（已在 4090 上复现）。
# 3B + 24G 不开检查点也放得下（实测约 16-18 GB），而且还省掉一遍注意力统计。
gradient_checkpointing: false
disable_dropout: true
dataset_num_proc: 8

seed: 42
output_dir: outputs/ea-3b-run1

# ---- EA-DPO：论文默认值（不是调参结论），第一轮只验证趋势 ----
ea_dpo_enabled: true
ea_lambda: 0.5
ea_tau_chosen: 2.0
ea_tau_rejected: 1.5
ea_kappa_chosen: 1.0
ea_kappa_rejected: 1.0
ea_gamma: 0.1
ea_entropy_cap_quantile: 0.95
ea_attention_chunk_size: 128
ea_row_delta: 1.0e-8
ea_epsilon: 1.0e-8
