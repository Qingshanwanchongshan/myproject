# Smoke test first: override --max_steps only after checking the logs.
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/ultrafeedback_binarized
attn_implementation: sdpa
dtype: bfloat16
bf16: true
use_peft: true
lora_r: 16
lora_alpha: 32
learning_rate: 5.0e-6
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
max_length: 1024
max_steps: 10
logging_steps: 1
eval_strategy: "no"
save_strategy: "no"
report_to: "none"
seed: 42
output_dir: outputs/ea-dpo-smoke
ea_dpo_enabled: true
ea_lambda: 0.5
ea_tau_chosen: 1.0
ea_tau_rejected: 0.7
ea_kappa_chosen: 1.0
ea_kappa_rejected: 1.0
ea_gamma: 1.0
ea_entropy_cap_quantile: 0.95
ea_attention_chunk_size: 128
ea_row_delta: 1.0e-8
ea_epsilon: 1.0e-8
