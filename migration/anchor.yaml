model_name_or_path: Qwen/Qwen2.5-3B-Instruct
dataset_name: data/uf-subset
attn_implementation: sdpa
dtype: bfloat16
bf16: true
use_peft: true
lora_r: 16
lora_alpha: 32
lora_target_modules: all-linear
learning_rate: 1.0e-05
beta: 0.1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_steps: 100
max_length: 1024
max_steps: 3753
num_train_epochs: 1
logging_steps: 5
eval_strategy: steps
eval_steps: 250
per_device_eval_batch_size: 2
save_strategy: steps
save_steps: 500
save_total_limit: 8
report_to: tensorboard
gradient_checkpointing: false
disable_dropout: true
dataset_num_proc: 8
seed: 42
output_dir: outputs/next-round/anchor
ea_dpo_enabled: true
ea_lambda: 0.1
ea_tau_chosen: 2.0
ea_tau_rejected: 1.5
ea_kappa_chosen: 1.0
ea_kappa_rejected: 1.0
ea_gamma: 0.1
ea_entropy_cap_quantile: 0.95
ea_attention_chunk_size: 128
ea_row_delta: 1.0e-08
ea_epsilon: 1.0e-08
ea_target_layer: 30
run_name: next-anchor
